trading:
  # ── Scalping mode ──────────────────────────────────────────────────────────
  # รอบสั้น 1m candle, ถือ position แค่ 2-10 นาที
  symbols:
    # ── Top 12 by Market Cap + Volume (Binance USDT Futures) ─────────────
    - BTCUSDT    # 1  Bitcoin        — vol $13.4B/day
    - ETHUSDT    # 2  Ethereum       — vol $10.1B/day
    - BNBUSDT    # 3  BNB            — market cap top 3
    - SOLUSDT    # 4  Solana         — vol $1.9B/day
    - XRPUSDT    # 5  XRP            — vol $0.7B/day
    - DOGEUSDT   # 6  Dogecoin       — high retail volume
    - ADAUSDT    # 7  Cardano        — market cap top 10
    - AVAXUSDT   # 8  Avalanche      — market cap top 10
    - LINKUSDT   # 9  Chainlink      — DeFi oracle leader
    - DOTUSDT    # 10 Polkadot       — market cap top 15
    - TRXUSDT    # 11 TRON           — market cap top 10, high tx volume
    - NEARUSDT   # 12 NEAR Protocol  — market cap top 20, consistent volume
  timeframe: 1m             # 1m สำหรับ scalping (3m ก็ได้ถ้า noise เยอะเกิน)
  leverage: 5               # $5,000: 5x — liquidation ห่าง ~20% (เดิม 10x สำหรับ $300)
  margin_type: ISOLATED
  testnet: true
  simulated_balance: null  # null = ดึง balance จริงจาก Binance
                            # ตั้งเป็น 300.0 หรือ 5000.0 เพื่อ override
risk:
  # ── $5,000 portfolio settings ────────────────────────────────────────────
  max_position_pct: 0.01      # 1% × $5,000 = $50/เทรด  (เดิม 0.02 = $6 สำหรับ $300)
  stop_loss_pct: 0.005        # SL 0.5% — กว้างกว่า noise 1m  (เดิม 0.004)
  take_profit_ratio: 2.0      # R:R 2:1 → TP = 1.0%  (เดิม 1.5)
  max_daily_loss_pct: 0.03    # หยุดถ้าขาดทุนเกิน 3% = $150/วัน  (เดิม 0.06 สำหรับ $300)
  max_open_positions: 1

  # ── $300 portfolio settings (สำรองไว้) ──────────────────────────────────
  # max_position_pct: 0.02    # 2% × $300 = $6/เทรด
  # stop_loss_pct: 0.004      # SL 0.4%
  # take_profit_ratio: 1.5    # R:R 1.5:1
  # max_daily_loss_pct: 0.06  # 6% = $18/วัน
  # leverage: 10              # 10x

  # ── $1,000 portfolio settings (สำรองไว้ — แนะนำสำหรับเริ่มจริง) ─────────
  # max_position_pct: 0.01    # 1% × $1,000 = $10/เทรด
  # stop_loss_pct: 0.005      # SL 0.5%
  # take_profit_ratio: 2.0    # R:R 2:1 → TP = 1.0%
  # max_daily_loss_pct: 0.03  # 3% = $30/วัน
  # max_portfolio_dd: 0.15    # 15% = $150
  # leverage: 5               # 5x — ปลอดภัย liquidation ห่าง ~20%

  # ── V2 Portfolio-level guards (handbook §8) ────────────────────────────────
  max_portfolio_dd: 0.15      # หยุดถ้า portfolio drawdown เกิน 15% = $750  (เดิม 0.25)
  max_leverage: 5.0           # Leverage cap  (เดิม 3.0)
  max_position_per_symbol: 0.05   # Max 5% of equity per symbol (notional)
  rolling_window: 50          # จำนวน trades สำหรับ rolling Sharpe / win-rate
  drift_kill_threshold: 3.0   # KL > 3.0 → kill-switch (ต้องเห็น ≥30 cycles ก่อน)
                              # ค่า KL สูตรนี้: volatility 2x ≈ 0.8 ต่อ feature
                              # KL 3.0 ≈ drift รุนแรงมาก (~5x vol หรือ mean shift ใหญ่)

strategy:
  # ── ใช้ EMA เร็วกว่าปกติสำหรับ scalping ──────────────────────────────────
  ema_fast: 3               # EMA 3 (ตอบสนองเร็วมาก)
  ema_slow: 8               # EMA 8
  ema_trend: 21             # EMA 21 (filter trend)
  rsi_period: 7             # RSI 7 (เร็วกว่า 14)
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: 6              # MACD เร็วขึ้น
  macd_slow: 13
  macd_signal: 4

  # ── Scalping-specific ─────────────────────────────────────────────────────
  volume_spike_mult: 1.5    # volume spike ≥ 1.5× avg = confirm signal
  max_hold_candles: 10      # บังคับปิด position ถ้าถือเกิน 10 candle (10 นาที)

ml:
  model_path: models/rf_model.pkl
  retrain_hours: 6          # retrain บ่อยขึ้น (data 1m เปลี่ยนเร็ว)
  lookback_candles: 1500
  min_train_samples: 150      # ลดลงให้ train ได้ด้วย 1500 candle × 1m
  lookahead_candles: 3      # predict 3 candle ข้างหน้า (3 นาที)
  confidence_threshold: 0.60
  n_estimators: 200
  rolling_window: 50        # จำนวน trades สำหรับ rolling Sharpe / win-rate trigger

  # ── V2 retraining thresholds (handbook §12.3) ────────────────────────────
  drift_threshold: 1.0      # KL divergence > 1.0 → retrain (~2x volatility change)
  drift_min_obs: 30         # ต้องเห็น ≥30 cycles ก่อนที่ drift score จะ feed kill-switch
  min_rolling_sharpe: 0.5   # Rolling Sharpe < 0.5 → retrain
  min_rolling_win_rate: 0.40  # Rolling win-rate < 40% → retrain

dashboard:
  host: 0.0.0.0
  port: 8080

bot:
  loop_interval_seconds: 10  # ตรวจสัญญาณทุก 10 วินาที
  klines_limit: 300
  signal_expiry_seconds: 300  # V2: สัญญาณหมดอายุหลัง 5 นาที
